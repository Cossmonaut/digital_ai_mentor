version: '3.8'

services:
  # 1. Приложение Digital Mentor
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: digital_mentor_app
    restart: always
    env_file:
      - ../src/api_keys.env
    environment:
      - NEO4J_URL=bolt://neo4j:7687
      - REDIS_URL=redis://redis_cache:6379
      - PYTHONPATH=/app
    depends_on:
      neo4j:
        condition: service_healthy
      redis_cache:
        condition: service_started
    volumes:
      - ../data:/app/data:ro
      - ../logs:/app/logs
    # Healthcheck для приложения
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 2. Графовая база данных Neo4j
  neo4j:
    image: neo4j:5.26.0
    container_name: mentor_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
    restart: always
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password123", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 3. Кэш Redis
  redis_cache:
    image: redis:7-alpine
    container_name: mentor_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

# Тома для персистентности данных
volumes:
  neo4j_data:
    external: true
    name: neo4j_data
  neo4j_plugins:
    external: true
    name: neo4j_plugins
  redis_data:
